name: npm lockfile synchronization

on:
  push:
    branches: ["feat/phase-09-*"]
    paths:
      - "package.json"
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Feature branch to synchronize (main is not permitted)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: searqon-lockfile-${{ github.event.inputs.target_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate target branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.inputs.target_branch || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "${TARGET_BRANCH}" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "${TARGET_BRANCH}" != "main" ]]
          echo "target_branch=${TARGET_BRANCH}" >> "${GITHUB_ENV}"

      - name: Check out target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm lockfile"
          git push origin "HEAD:${TARGET_BRANCH}"
