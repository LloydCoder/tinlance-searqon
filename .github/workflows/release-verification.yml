name: Release verification

on:
  push:
    branches: ["verify/v*"]

permissions:
  contents: read
  attestations: read

jobs:
  verify-release:
    name: Verify release assets, checksums, and attestations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Resolve exact package release
        id: release
        env:
          VERIFY_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="v${VERSION}"
          test "$VERIFY_BRANCH" = "verify/$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "package_file=tinlance-searqon-${VERSION}.tgz" >> "$GITHUB_OUTPUT"

      - name: Download published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$RELEASE_TAG" --dir dist

      - name: Verify release asset SHA-256 checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Validate package archive and CycloneDX SBOM
        env:
          PACKAGE_FILE: ${{ steps.release.outputs.package_file }}
        run: |
          set -euo pipefail
          test -s "dist/$PACKAGE_FILE"
          test -s dist/sbom.cdx.json
          tar -tzf "dist/$PACKAGE_FILE" >/dev/null
          node --input-type=module -e 'import fs from "node:fs"; const sbom=JSON.parse(fs.readFileSync("dist/sbom.cdx.json","utf8")); if (sbom.bomFormat !== "CycloneDX" || !sbom.components) process.exit(1);'

      - name: Verify package provenance signature and approved signer identity
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.release.outputs.package_file }}
        run: |
          set -euo pipefail
          for signer in \
            "$GITHUB_REPOSITORY/.github/workflows/release-provenance.yml" \
            "$GITHUB_REPOSITORY/.github/workflows/release-attestation-repair.yml"; do
            if gh attestation verify "dist/$PACKAGE_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" \
              --format json > provenance-verification.json; then
              echo "Verified package provenance signer: $signer"
              exit 0
            fi
          done
          echo "No approved package provenance signer verified" >&2
          exit 1

      - name: Verify CycloneDX SBOM attestation and approved signer identity
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.release.outputs.package_file }}
        run: |
          set -euo pipefail
          for signer in \
            "$GITHUB_REPOSITORY/.github/workflows/release-provenance.yml" \
            "$GITHUB_REPOSITORY/.github/workflows/release-attestation-repair.yml"; do
            if gh attestation verify "dist/$PACKAGE_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://cyclonedx.org/bom \
              --signer-workflow "$signer" \
              --format json > sbom-attestation-verification.json; then
              echo "Verified SBOM attestation signer: $signer"
              exit 0
            fi
          done
          echo "No approved CycloneDX SBOM signer verified" >&2
          exit 1
