name: CI

on:
  push:
    branches: [main, "bootstrap/**", "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: searqon-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-security:
    name: PostgreSQL tenant isolation and audit controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: searqon-ci-only
          POSTGRES_DB: searqon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d searqon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: searqon-ci-only
      DATABASE_URL: postgresql://postgres:searqon-ci-only@127.0.0.1:5432/searqon_test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply platform schema
        run: npm run db:migrate
      - name: Verify row-level tenant isolation and append-only audit
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --file db/tests/tenant-isolation.sql
      - name: Create restricted runtime login for authentication integration
        run: |
          psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --command "CREATE ROLE searqon_runtime LOGIN PASSWORD 'runtime-test-only' NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOBYPASSRLS"
          psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --command "GRANT searqon_app TO searqon_runtime"
      - name: Verify Node.js tenant transactions against PostgreSQL
        run: node --test test/database.integration.test.js
        env:
          SEARQON_TEST_DATABASE: "1"
      - name: Verify passwordless authentication against PostgreSQL
        run: node --test test/auth.integration.test.js
        env:
          SEARQON_TEST_DATABASE: "1"
          SEARQON_RUNTIME_DATABASE_URL: postgresql://searqon_runtime:runtime-test-only@127.0.0.1:5432/searqon_test
      - name: Verify tenant-scoped project and assessment persistence
        run: node --test test/workspaces.integration.test.js
        env:
          SEARQON_TEST_DATABASE: "1"
          SEARQON_RUNTIME_DATABASE_URL: postgresql://searqon_runtime:runtime-test-only@127.0.0.1:5432/searqon_test
      - name: Verify atomic usage reservations, settlement and tenant isolation
        run: node --test test/usage-ledger.integration.test.js
        env:
          SEARQON_TEST_DATABASE: "1"
          SEARQON_RUNTIME_DATABASE_URL: postgresql://searqon_runtime:runtime-test-only@127.0.0.1:5432/searqon_test
      - name: Verify subscription and redacted webhook inbox schema
        run: node --test test/billing-lifecycle.integration.test.js
        env:
          SEARQON_TEST_DATABASE: "1"
          SEARQON_RUNTIME_DATABASE_URL: postgresql://searqon_runtime:runtime-test-only@127.0.0.1:5432/searqon_test
      - name: Verify canonical subscription entitlement resolution
        run: node --test test/subscription-entitlements.integration.test.js
        env:
          SEARQON_TEST_DATABASE: "1"
          SEARQON_RUNTIME_DATABASE_URL: postgresql://searqon_runtime:runtime-test-only@127.0.0.1:5432/searqon_test

  test:
    name: Tests and package validation (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Download and verify pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          curl --fail --location --silent --show-error --retry 3 "${url}" --output "/tmp/${archive}"
          printf '%s  %s\n' "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8" "/tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /tmp actionlint

      - name: Lint GitHub Actions workflows
        run: /tmp/actionlint -color .github/workflows/*.yml

      - name: Check JavaScript syntax
        run: |
          for file in src/*.js src/security/*.js src/platform/*.js test/*.js apps/web/server.js apps/web/public/app.js apps/web/public/pages.js apps/web/public/app/workspace.js apps/web/public/auth/auth.js; do
            node --check "$file"
          done
      - name: Run test suite
        run: npm test
      - name: Smoke-test documented CLI examples
        run: |
          node src/cli.js scan ./examples/site.html >/dev/null
          node src/cli.js scan ./examples/site.html --out /tmp/searqon-assessment.json
          node src/cli.js report /tmp/searqon-assessment.json --out /tmp/searqon-assessment.html
          test -s /tmp/searqon-assessment.html
          node src/cli.js scan ./examples/openapi.json >/dev/null
          node src/cli.js scan ./examples/api-docs.md >/dev/null
          node src/cli.js scan ./examples/mcp-snapshot.json --format mcp >/dev/null
          node src/cli.js geo analyze ./examples/geo-observation.json >/dev/null
          node src/cli.js geo aggregate ./examples/geo-observations.json >/dev/null
          node src/cli.js geo alerts ./examples/geo-alert-input.json >/dev/null
          node src/cli.js geo citation-changes ./examples/geo-citation-change-input.json >/dev/null
          node src/cli.js geo quality-evaluate ./examples/geo-citation-alert-quality-input.json >/dev/null
      - name: Audit dependency tree
        run: npm audit --audit-level=high
      - name: Validate package contents
        run: npm pack --dry-run
      - name: Validate CycloneDX SBOM generation
        run: |
          npm sbom --sbom-format cyclonedx --sbom-type application > /tmp/searqon-sbom.cdx.json
          node -e 'const s=JSON.parse(require("node:fs").readFileSync("/tmp/searqon-sbom.cdx.json","utf8")); if (s.bomFormat !== "CycloneDX") process.exit(1);'
