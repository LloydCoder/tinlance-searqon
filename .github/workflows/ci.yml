name: CI

on:
  push:
    branches: [main, "bootstrap/**", "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: searqon-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and package validation (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Check JavaScript syntax
        run: |
          for file in src/*.js test/*.js; do
            node --check "$file"
          done
      - name: Run test suite
        run: npm test
      - name: Validate package contents
        run: npm pack --dry-run
