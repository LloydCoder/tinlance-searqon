name: Secret scanning

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify pinned Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl --fail --location --silent --show-error --retry 3 "${url}" --output "/tmp/${archive}"
          printf '%s  %s\n' "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" "/tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan all reachable Git history
        shell: bash
        run: /tmp/gitleaks git --redact --exit-code 1 --log-opts="--all"
