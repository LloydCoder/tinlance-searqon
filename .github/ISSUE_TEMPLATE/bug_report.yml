name: Bug report
description: Report a reproducible defect in an implemented Searqon capability.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Report only issues you can safely disclose publicly. For security vulnerabilities, follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Searqon version or commit
      description: Provide the package version or Git commit SHA.
      placeholder: "0.2.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "node --version"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04, macOS 15, Windows 11"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal synthetic or redacted input where possible.
      placeholder: "1. Run ...\n2. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Redact tokens, private URLs, customer data and personal information.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and sensitive data.
          required: true
        - label: This is not a security vulnerability report.
          required: true
